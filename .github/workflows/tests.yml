name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: telegram_bot_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: telegram_bot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telegram_bot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for the CI database only; no real secrets.
      SECRET_KEY: ci-only-not-secret
      DB_NAME: telegram_bot
      DB_USER: telegram_bot_test
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core telegram_bot --noinput
